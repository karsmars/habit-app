<!doctype html>
<html lang="en" data-theme="sage">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F3EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habit App">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Habit App</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/themes.css">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/theme-init.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="./" aria-label="Habit App home">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <span>Habit App</span>
      </a>
      <div class="header-actions">
        <span id="sync-status" class="sync-status" role="status" aria-live="polite">
          <span class="sync-dot" aria-hidden="true"></span><span id="sync-label">Set up sync</span>
        </span>
        <button id="refresh-button" class="icon-button" type="button" aria-label="Refresh data" title="Refresh">↻</button>
        <button id="settings-button" class="icon-button" type="button" aria-label="Open settings" title="Settings">⚙</button>
      </div>
    </header>

    <main id="main-content" tabindex="-1">
      <section id="view-today" class="view active" aria-labelledby="today-heading"></section>
      <section id="view-progress" class="view" aria-labelledby="progress-heading" hidden></section>
      <section id="view-calendar" class="view" aria-labelledby="calendar-heading" hidden></section>
      <section id="view-shop" class="view" aria-labelledby="shop-heading" hidden></section>
      <section id="view-settings" class="view settings-view" aria-labelledby="settings-heading" hidden></section>
    </main>

    <nav class="tab-bar" aria-label="Main navigation">
      <button class="tab-button active" type="button" data-tab="today" aria-current="page"><span aria-hidden="true">☑</span><span>Today</span></button>
      <button class="tab-button" type="button" data-tab="progress"><span aria-hidden="true">▥</span><span>Progress</span></button>
      <button class="tab-button" type="button" data-tab="calendar"><span aria-hidden="true">▦</span><span>Calendar</span></button>
      <button class="tab-button" type="button" data-tab="shop"><span aria-hidden="true">☆</span><span>Shop</span></button>
    </nav>
  </div>

  <dialog id="app-dialog" aria-labelledby="dialog-title">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close icon-button" value="cancel" aria-label="Close dialog">×</button>
      <h2 id="dialog-title"></h2>
      <div id="dialog-content"></div>
      <div id="dialog-actions" class="dialog-actions"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
